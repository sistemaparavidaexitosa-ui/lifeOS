[project]
name = "manifestation-architect"
version = "1.0.0"
description = "El Arquitecto de Manifestación de LifeOS: escribe el brief de identidad diario (D-164)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manifestation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# El agente nunca debe importar un cliente de Supabase. Es un invariante de la
# topología (D-164) y se prueba como tal en test_manifestation_memory.py.
filterwarnings = ["error::DeprecationWarning:manifestation.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
