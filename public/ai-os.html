<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LifeOS · AI Operating System (prototipo UX)</title>
<meta name="description" content="Prototipo UX experimental: una IA activa que entiende tu vida, la conecta y te ayuda a ejecutar." />
<style>
/* ============================================================
   LifeOS · AI OS — prototipo UX (mock data, sin backend)
   Tokens propios: este archivo NO hereda globals.css a propósito,
   la dirección visual es oscura/premium y se prueba aislada.
   ============================================================ */
:root{
  --bg:#07070b; --bg2:#0b0b12;
  --ink:#ECECF1; --ink-2:#C7C7D4; --muted:#83839B;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13);
  --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.055);
  /* Acento vivo: lo reescribe el motor del tiempo en cada momento del día */
  --a1:#7C8CFF; --a2:#C084FC; --glow:rgba(124,140,255,.30);
  --ok:#4ADE80; --warn:#FBBF24; --bad:#FB7185;
  --r:18px; --r2:12px;
  --ff:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--ff);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  font-feature-settings:"ss01","cv11";
}
/* Ambiente: dos auroras que cambian de color y posición según la hora */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .8s ease}
#ambient::before,#ambient::after{
  content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.34;
  transition:background 1.6s cubic-bezier(.4,0,.2,1), transform 1.6s cubic-bezier(.4,0,.2,1);
}
#ambient::before{width:60vw;height:60vw;top:-22vw;left:-10vw;background:var(--a1)}
#ambient::after{width:52vw;height:52vw;bottom:-24vw;right:-12vw;background:var(--a2)}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.055) .5px,transparent .5px);background-size:3px 3px}

/* ---------- Layout ---------- */
.app{position:relative;z-index:2;display:flex;flex-direction:column;height:100dvh;max-width:100vw;overflow-x:hidden}
header.top{display:flex;align-items:center;gap:14px;padding:14px 20px;flex:0 0 auto;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.brand b{font-weight:650;letter-spacing:.06em;text-transform:none;font-size:14px;color:var(--ink)}
/* El orbe: presencia de la IA. Respira siempre; late fuerte cuando "piensa". */
.orb{width:26px;height:26px;border-radius:50%;position:relative;flex:0 0 auto;
  background:radial-gradient(circle at 32% 30%,#fff,var(--a1) 42%,var(--a2) 100%);
  box-shadow:0 0 22px var(--glow);animation:breathe 4.5s ease-in-out infinite;transition:box-shadow .4s}
.orb.thinking{animation:breathe 1.05s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.14);opacity:1}}

.switcher{display:flex;gap:2px;padding:3px;margin:0 auto;border:1px solid var(--line);
  background:rgba(255,255,255,.03);border-radius:999px;backdrop-filter:blur(14px)}
.switcher button{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:inherit;font-size:13px;padding:7px 15px;border-radius:999px;transition:.22s;white-space:nowrap}
.switcher button:hover{color:var(--ink-2)}
.switcher button[aria-selected="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.07) inset}

.clockbox{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:0}
.clock{font:600 15px/1 var(--mono);letter-spacing:.02em;min-width:58px;text-align:right}
.clock small{display:block;font:400 10px/1.5 var(--ff);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;font-size:13px;transition:.2s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
.iconbtn.on{color:#07070b;background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
#scrub{width:132px;accent-color:var(--a1);background:transparent;cursor:pointer}

main{flex:1 1 auto;min-height:0;position:relative}
.surface{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px);
  transition:opacity .35s ease,transform .35s ease,visibility 0s linear .35s}
.surface.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.wrap{max-width:820px;margin:0 auto;padding:10px 20px 180px}
.wrap.wide{max-width:1180px}

/* ---------- Tipografía / piezas ---------- */
.eyebrow{font:500 11px/1 var(--ff);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h1.say{font-size:clamp(26px,3.6vw,38px);line-height:1.22;letter-spacing:-.025em;font-weight:600;margin:0 0 18px}
.say .dim{color:var(--muted)}
.lead{font-size:17px;line-height:1.62;color:var(--ink-2);margin:0 0 18px;max-width:64ch}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 20px;backdrop-filter:blur(16px)}
.card + .card{margin-top:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > .card{flex:1 1 180px}
.k{font:500 11px/1 var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.v{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:8px}
.v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:6px}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.09);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .9s cubic-bezier(.4,0,.2,1)}

/* Afirmación: la pieza más "ritual" de la pantalla */
.affirm{border:1px solid var(--line-2);border-radius:var(--r);padding:22px 24px;margin-top:14px;
  background:linear-gradient(135deg,rgba(124,140,255,.13),rgba(192,132,252,.07));position:relative;overflow:hidden}
.affirm q{display:block;font-size:19px;line-height:1.5;font-weight:500;letter-spacing:-.01em;quotes:none}
.affirm .k{margin-bottom:10px}

/* Prioridades */
.prio{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.prio:first-of-type{border-top:0}
.prio .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;margin-top:2px;
  font:600 11px/1 var(--mono);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.prio.done .n{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#07070b}
.prio.done .t{text-decoration:line-through;color:var(--muted)}
.prio.done.keep .t{text-decoration:none;color:var(--ink)}
.prio .t{font-size:15px;font-weight:500;line-height:1.4}
.prio .s{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}

/* Insight de IA */
.insight{border:1px solid var(--line);border-left:2px solid var(--a1);border-radius:var(--r2);
  padding:14px 16px;background:rgba(124,140,255,.06);margin-top:12px}
.insight .k{color:var(--a1);opacity:.95;display:flex;align-items:center;gap:7px}
.insight p{margin:9px 0 0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.insight.warn{border-left-color:var(--warn);background:rgba(251,191,36,.055)}
.insight.warn .k{color:var(--warn)}

/* Chips / acciones */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{appearance:none;font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:.2s;white-space:nowrap}
.chip:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-2);transform:translateY(-1px)}
.chip.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#07070b;border-color:transparent;font-weight:550}
.chip.on{border-color:var(--a1);color:var(--ink)}

/* Watchlist */
.tick{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tick:first-child{border-top:0}
.tick .sym{font:600 13px/1 var(--mono);width:52px}
.tick .nm{font-size:13px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick .px{font:500 13px/1 var(--mono);color:var(--ink-2)}
.tick .ch{font:600 13px/1 var(--mono);width:66px;text-align:right}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
.spark{width:56px;height:20px;flex:0 0 auto;opacity:.85}

/* ---------- Grafo ---------- */
.graphstage{position:absolute;inset:0;display:flex}
#gcanvas{flex:1;display:block;cursor:grab;touch-action:none}
#gcanvas.drag{cursor:grabbing}
.gbar{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;z-index:3;pointer-events:none}
.gbar > *{pointer-events:auto}
.ghint{position:absolute;bottom:104px;left:16px;font-size:12px;color:var(--muted);z-index:3;letter-spacing:.01em}
/* Panel contextual: entra desde la derecha, nunca tapa el lienzo entero */
.ctx{width:min(380px,92vw);flex:0 0 auto;border-left:1px solid var(--line);background:rgba(9,9,15,.95);
  backdrop-filter:blur(22px);overflow:auto;padding:20px 20px 120px;
  position:absolute;top:0;right:0;bottom:0;transform:translateX(102%);transition:transform .38s cubic-bezier(.4,0,.2,1);z-index:22}
.ctx.open{transform:none}
.ctx h2{font-size:22px;letter-spacing:-.02em;margin:10px 0 6px;font-weight:600}
.ctx .type{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--ff);letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.rel{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.rel:hover .rn{color:var(--ink)}
.rel .rv{font:400 11px/1.4 var(--ff);color:var(--muted);width:82px;flex:0 0 auto;text-transform:lowercase}
.rel .rn{font-size:14px;color:var(--ink-2);transition:.15s}
.ctxclose{position:absolute;top:14px;right:14px}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:30px;margin-top:8px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.slot{position:relative;padding:0 0 22px}
.slot::before{content:"";position:absolute;left:-29px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--line-2);transition:.3s}
.slot.past::before{background:var(--line-2)}
.slot.now::before{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;box-shadow:0 0 0 5px var(--glow)}
.slot .h{font:600 12px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
.slot.now .h{color:var(--a1)}
.slot .ttl{font-size:15.5px;font-weight:550;margin-top:6px;letter-spacing:-.01em}
.slot .note{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.55;max-width:60ch}
.slot.free .ttl{color:var(--muted);font-weight:400;font-style:italic}

/* ---------- Memoria ---------- */
.mem{padding:15px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0}
.mem .f{font-size:15px;line-height:1.5}
.mem .src{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conf{width:44px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;display:inline-block}
.conf i{display:block;height:100%;background:var(--a1)}

/* ---------- Command input ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 16px 18px;
  background:linear-gradient(to top,var(--bg) 46%,rgba(7,7,11,.92) 78%,transparent)}
.dockin{max-width:820px;margin:0 auto}
.convo{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:44vh;overflow:auto}
.msg{border-radius:var(--r2);padding:12px 15px;font-size:14.5px;line-height:1.6;animation:rise .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;max-width:78%;background:#1b1b28;border:1px solid var(--line);backdrop-filter:blur(18px)}
.msg.ai{align-self:flex-start;max-width:92%;background:#12121f;border:1px solid rgba(124,140,255,.26);box-shadow:0 8px 30px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.msg.ai b{font-weight:600}
.msg .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bubble{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:999px;
  background:rgba(14,14,22,.9);backdrop-filter:blur(20px);padding:6px 6px 6px 18px;transition:.25s;
  box-shadow:0 8px 40px rgba(0,0,0,.5)}
.bubble:focus-within{border-color:var(--a1);box-shadow:0 8px 44px var(--glow)}
.bubble input{flex:1;min-width:0;appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:10px 0;outline:0}
.bubble input::placeholder{color:var(--muted)}
.send{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#07070b;font-size:15px;display:grid;place-items:center;transition:.2s}
.send:hover{transform:scale(1.07)}
.hints{display:flex;gap:7px;margin:0 0 9px;flex-wrap:wrap;justify-content:center}
.hints .chip{font-size:12px;padding:5px 11px;background:rgba(255,255,255,.028)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--a1);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* Toast */
#toast{position:fixed;bottom:112px;left:50%;transform:translate(-50%,16px);z-index:40;opacity:0;
  border:1px solid var(--line-2);background:rgba(16,16,26,.96);backdrop-filter:blur(16px);
  border-radius:999px;padding:10px 20px;font-size:13.5px;transition:.3s;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  header.top{flex-wrap:wrap;gap:10px;padding:12px 14px}
  .brand{flex:1 1 auto;min-width:0}
  .switcher{order:3;width:100%;margin:2px 0;justify-content:space-between}
  .switcher button{flex:1 1 0;min-width:0;padding:8px 4px;font-size:12px}
  #scrub{width:58px}
  .clock{min-width:50px;font-size:14px}
  .iconbtn{width:30px;height:30px}
  h1.say{font-size:24px}
  .hints{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px;scrollbar-width:none}
  .hints::-webkit-scrollbar{display:none}
  .gbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .gbar::-webkit-scrollbar{display:none}
  .wrap{padding:6px 16px 190px}
  .ctx{width:100%;border-left:0;border-top:1px solid var(--line);top:auto;height:70%;z-index:15;padding-bottom:150px}
  .ctx{transform:translateY(102%)} .ctx.open{transform:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="ambient"></div><div id="grain"></div>

<div class="app">
  <header class="top">
    <div class="brand"><span class="orb" id="orb"></span><b>LifeOS</b></div>

    <nav class="switcher" role="tablist" aria-label="Superficies">
      <button role="tab" data-surface="now"    aria-selected="true">Ahora</button>
      <button role="tab" data-surface="graph"  aria-selected="false">Life Graph</button>
      <button role="tab" data-surface="day"    aria-selected="false">Mi día</button>
      <button role="tab" data-surface="memory" aria-selected="false">Memoria</button>
    </nav>

    <div class="clockbox">
      <input id="scrub" type="range" min="0" max="6" step="1" value="0" aria-label="Momento del día" />
      <div class="clock"><span id="clock">05:00</span><small id="phase">Despertar</small></div>
      <button class="iconbtn" id="play"  title="Vivir el día (auto)" aria-label="Vivir el día">▶</button>
      <button class="iconbtn" id="voice" title="Voz de la IA" aria-label="Voz de la IA"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    </div>
  </header>

  <main>
    <section class="surface active" id="s-now"><div class="wrap" id="now"></div></section>

    <section class="surface" id="s-graph">
      <div class="graphstage">
        <canvas id="gcanvas"></canvas>
        <div class="gbar" id="gfilters"></div>
        <div class="ghint">Arrastra para mover · rueda o pellizco para zoom · clic en un nodo</div>
        <aside class="ctx" id="ctx" aria-live="polite"></aside>
      </div>
    </section>

    <section class="surface" id="s-day"><div class="wrap" id="day"></div></section>
    <section class="surface" id="s-memory"><div class="wrap" id="memory"></div></section>
  </main>
</div>

<div class="dock">
  <div class="dockin">
    <div class="convo" id="convo"></div>
    <div class="hints" id="hints"></div>
    <form class="bubble" id="cmdform" autocomplete="off">
      <input id="cmd" placeholder="Habla con tu LifeOS…  «mañana tengo que preparar la presentación para dirección»" aria-label="Comando" />
      <button type="button" class="iconbtn" id="mic" title="Dictar" aria-label="Dictar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg></button>
      <button class="send" type="submit" aria-label="Enviar">↑</button>
    </form>
  </div>
</div>

<div id="toast" role="status"></div>
<script>
/* ============================================================================
   LifeOS · AI OS — prototipo UX
   Todo es MOCK: ni red, ni auth, ni Supabase, ni IA real. El "razonamiento"
   es determinista y está escrito a mano para poder responder una sola
   pregunta: ¿cómo se SIENTE una IA que conoce tu vida entera?
   Los bloques marcados /* COMPONENTE: X * / son los que se portan a React
   con el mismo nombre (AICommandCenter, MorningBriefing, KnowledgeGraph…).
   ============================================================================ */
"use strict";

/* =========================== 1. MOCK: EL DÍA =============================== */
/* Cada momento reescribe el ambiente, lo que la IA dice PRIMERO (nunca espera
   a que le pregunten) y qué piezas aparecen. Ese es el corazón del concepto. */
const MOMENTS = [
  {
    t:"05:00", phase:"Despertar", a1:"#F0A868", a2:"#C2557A",
    say:["Buenos días, Luis.","Te detecté de pie a las 4:52 — tres minutos antes de la alarma."],
    lead:"Dormiste <b>7h 20m</b> y tu recuperación está en <b>87%</b>. Es tu tercer día seguido por encima del 80%: hoy aguanta un bloque profundo largo.",
    blocks:["vitals","affirmation","priorities","insight-morning"],
    chips:[["Empezar rutina matutina","routine"],["Leer mis 3 prioridades","prio"],["Hoy no puedo, ajústame el día","adapt"]]
  },
  {
    t:"07:00", phase:"Rutina", a1:"#E8A33D", a2:"#9C6BE0",
    say:["Vas bien, Luis.","Gym y meditación hechos; llevas 14 días de racha."],
    lead:"Te quedan <b>25 minutos</b> antes del primer bloque. La lectura de hoy conecta directo con tu proyecto: <b>Agentic Patterns</b>, capítulo 4.",
    blocks:["routine-progress","insight-streak"],
    chips:[["Marcar lectura como hecha","done-read"],["Mover lectura a la noche","move-read"],["¿Por qué ese capítulo?","why-read"]]
  },
  {
    t:"09:00", phase:"Bloque profundo", a1:"#7C8CFF", a2:"#C084FC",
    say:["Protegí tu bloque de 09:00 a 11:00.","Silencié notificaciones y moví dos correos a las 11."],
    lead:"Hoy toca lo que mueve la aguja: <b>definir el esquema de agentes</b> de Intelligent Execution OS. Es la tarea con mayor impacto estratégico de tu semana.",
    blocks:["focus","impact","insight-focus"],
    chips:[["Iniciar bloque de 90 min","focus-start"],["Enséñame el contexto","ctx-proj"],["Hoy prefiero Malpaso","swap"]]
  },
  {

const el = (h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild;};
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._i); toast._i=setTimeout(()=>t.classList.remove("show"),2600);
}
function think(ms){ // el orbe late fuerte mientras la IA "piensa"
  const o=$("#orb"); o.classList.add("thinking");
  clearTimeout(think._i); think._i=setTimeout(()=>o.classList.remove("thinking"), ms||900);
}
function speak(text){ // COMPONENTE: VoicePresence — la IA habla primero
  if(!S.voice || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,""));
    u.lang="es-MX"; u.rate=1.02; u.pitch=.95; speechSynthesis.speak(u);
  }catch(e){/* sin voz, el prototipo sigue funcionando igual */}
}

/* Máquina de escribir: hace que el texto de la IA se sienta generado, no
   impreso. Es la diferencia entre "dashboard" y "alguien te está hablando". */
function type(node, html, done){
  const plain = html.replace(/<[^>]+>/g,"");
  let i=0; node.innerHTML="";
  const caret=document.createElement("span"); caret.className="caret"; node.appendChild(caret);
  clearInterval(type._i);
  type._i=setInterval(()=>{
    i+=2;
    if(i>=plain.length){ clearInterval(type._i); node.innerHTML=html; done&&done(); return; }
    node.innerHTML=esc(plain.slice(0,i)); node.appendChild(caret);
  }, 16);
}

/* ========================= 5. MOTOR DEL TIEMPO =============================
   Lo que convierte esto en un "viaje": mover la hora cambia el ambiente, el
   discurso de la IA y las piezas visibles. La IA nunca espera una pregunta. */
function setMoment(i,{announce=true}={}){
  S.m = Math.max(0, Math.min(MOMENTS.length-1, i));
  const m = MOMENTS[S.m];
  document.documentElement.style.setProperty("--a1", m.a1);
  document.documentElement.style.setProperty("--a2", m.a2);
  document.documentElement.style.setProperty("--glow", hexA(m.a1,.3));
  $("#clock").textContent=m.t; $("#phase").textContent=m.phase; $("#scrub").value=String(S.m);
  renderNow({announce});
  renderDay();
  if(announce){ think(1200); }
}
function hexA(hex,a){
  const h=hex.replace("#",""); const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ===================== COMPONENTE: AICommandCenter =========================
   La home. No es un dashboard: es lo que la IA tiene que decirte AHORA,
   en el orden en que importa, y nada más. */
function renderNow({announce}={}){
  const m=MOMENTS[S.m];
  const host=$("#now");
  host.innerHTML=`
    <p class="eyebrow">${m.t} · ${esc(m.phase)}</p>
    <h1 class="say" id="sayline"></h1>
    <p class="lead" id="leadline">${m.lead}</p>
    <div id="blocks"></div>
    <div class="chips" id="nowchips"></div>`;

  const say = `${esc(m.say[0])} <span class="dim">${esc(m.say[1])}</span>`;
  if(announce){ type($("#sayline"), say, ()=>speak(m.say.join(" "))); }
  else { $("#sayline").innerHTML=say; }

  const B=$("#blocks");
  m.blocks.forEach(b=>{ const n=BLOCK[b] && BLOCK[b](); if(n) B.appendChild(n); });

  const C=$("#nowchips");
  m.chips.forEach(([label,act])=>{
    const c=el(`<button class="chip">${esc(label)}</button>`);
    c.onclick=()=>quickAction(act,label); C.appendChild(c);
  });
}

/* ====================== COMPONENTE: KnowledgeGraph =========================
   Lienzo 2D + simulación de fuerzas mínima. Canvas y no SVG por la misma
   razón que el grafo real del repo: con cientos de nodos y etiquetas, el DOM
   se arrodilla. Posiciones y cámara viven en variables sueltas (nunca en
   estado "reactivo"): se tocan 60 veces por segundo.
   ============================================================================ */
const cv=$("#gcanvas"), cx=cv.getContext("2d");
let P={};                       // id -> {x,y,vx,vy,fx,fy}
let cam={k:1, x:0, y:0};        // cámara: escala y desplazamiento
let hover=null, dragNode=null, dragging=false, last=null, alpha=1, raf=0;

function allNodes(){ return NODES.concat(S.extraNodes); }
function allEdges(){ return EDGES.concat(S.extraNodes.flatMap(n=>n.links||[])); }
function visible(n){ return !S.filters.has(n.type); }
function nodeById(id){ return allNodes().find(n=>n.id===id); }

function initGraph(){
  const R=Math.min(cv.width,cv.height)/3 || 300;
  allNodes().forEach((n,i)=>{
    if(P[n.id]) return;
    const a=(i/allNodes().length)*Math.PI*2;
    P[n.id]={x:n.id==="me"?0:Math.cos(a)*R*(0.4+Math.random()*0.7),
             y:n.id==="me"?0:Math.sin(a)*R*(0.4+Math.random()*0.7), vx:0, vy:0};
  });
  alpha=1; if(!raf) raf=requestAnimationFrame(tick);
}

/* Un paso de simulación: repulsión O(n²) — con ~40 nodos es gratis y evita
   traer un quadtree que aquí no compra nada. */
function step(){
  const ns=allNodes().filter(visible), idx={};
  ns.forEach(n=>idx[n.id]=true);
  for(let i=0;i<ns.length;i++){
    const a=P[ns[i].id];
    for(let j=i+1;j<ns.length;j++){
      const b=P[ns[j].id];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy||1;
      const f=2600/d2, d=Math.sqrt(d2);
      const ux=dx/d*f, uy=dy/d*f;
      a.vx-=ux; a.vy-=uy; b.vx+=ux; b.vy+=uy;
    }
  }
  allEdges().forEach(([s,t])=>{
    if(!idx[s]||!idx[t]) return;
    const a=P[s], b=P[t]; if(!a||!b) return;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const f=(d-118)*0.014, ux=dx/d*f, uy=dy/d*f;
    a.vx+=ux; a.vy+=uy; b.vx-=ux; b.vy-=uy;
  });
  ns.forEach(n=>{
    const p=P[n.id];
    p.vx-=p.x*0.0035; p.vy-=p.y*0.0035;         // gravedad al centro
    if(n.id==="me"){ p.x*=0.9; p.y*=0.9; }       // el usuario tiende al centro
    p.vx*=0.82; p.vy*=0.82;
    if(dragNode!==n.id){ p.x+=p.vx*alpha; p.y+=p.vy*alpha; }
  });
  alpha=Math.max(0.15, alpha*0.995);
}

function neighborsOf(id){
  const s=new Set();
  allEdges().forEach(([a,b])=>{ if(a===id)s.add(b); if(b===id)s.add(a); });
  return s;
}

function draw(){
  const w=cv.width, h=cv.height, dpr=window.devicePixelRatio||1;
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,w,h);
  cx.translate(w/2+cam.x*dpr, h/2+cam.y*dpr); cx.scale(cam.k*dpr, cam.k*dpr);

  const sel=S.selected, near=sel?neighborsOf(sel):null;
  const on=(id)=>!sel || id===sel || near.has(id);

  /* Aristas primero, agrupadas por opacidad para no cambiar estado por línea */
  [[0.10,false],[0.55,true]].forEach(([op,isNear])=>{
    cx.strokeStyle=`rgba(255,255,255,${op})`; cx.lineWidth=isNear?1.2:0.8; cx.beginPath();
    allEdges().forEach(([s,t])=>{
      const a=nodeById(s), b=nodeById(t); if(!a||!b||!visible(a)||!visible(b)) return;
      const active = sel && (s===sel||t===sel);
      if(!!active!==isNear) return;
      if(!sel && isNear) return;
      const pa=P[s], pb=P[t]; if(!pa||!pb) return;
      cx.moveTo(pa.x,pa.y); cx.lineTo(pb.x,pb.y);
    });
    cx.stroke();
  });

  /* Verbo de la relación: solo para el nodo seleccionado, o sería ilegible */
  if(sel && cam.k>0.5){
    cx.font="500 10px "+getComputedStyle(document.body).fontFamily;
    cx.fillStyle="rgba(255,255,255,.42)"; cx.textAlign="center";
    allEdges().forEach(([s,t,v])=>{
      if(s!==sel && t!==sel) return;
      const pa=P[s], pb=P[t]; if(!pa||!pb||!v) return;
      const a=nodeById(s), b=nodeById(t); if(!visible(a)||!visible(b)) return;
      cx.fillText(v,(pa.x+pb.x)/2,(pa.y+pb.y)/2-4);
    });
  }

  /* Nodos */
  allNodes().forEach(n=>{
    if(!visible(n)) return;
    const p=P[n.id]; if(!p) return;
    const c=TYPES[n.type].color, r=n.size*(n.id===sel?1.22:1), dim=!on(n.id);
    cx.globalAlpha = dim?0.16:1;
    if(n.id===sel || n.id===hover){
      cx.beginPath(); cx.arc(p.x,p.y,r+11,0,7); cx.fillStyle=c+"22"; cx.fill();
    }
    cx.beginPath(); cx.arc(p.x,p.y,r,0,7);
    cx.fillStyle = n.type==="identity" ? c : c+"cc";
    cx.fill();
    cx.lineWidth=1.2; cx.strokeStyle="rgba(7,7,11,.85)"; cx.stroke();

    const label = n.id===sel || n.id===hover || (near&&near.has(n.id)) || n.size>=14 || cam.k>1.05;
    if(label && !dim){
      cx.font=`${n.size>=16?"600":"500"} ${Math.max(10,n.size*0.62)}px ${getComputedStyle(document.body).fontFamily}`;
      cx.textAlign="center"; cx.fillStyle= n.id===sel?"#fff":"rgba(236,236,241,.8)";
      cx.fillText(n.label, p.x, p.y+r+13);
    }
    cx.globalAlpha=1;
  });
}

function tick(){ step(); draw(); raf=requestAnimationFrame(tick); }

function resize(){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
}
function fitGraph(){
  resize();
  const ns=allNodes().filter(visible).map(n=>P[n.id]).filter(Boolean);
  if(!ns.length) return;
  const xs=ns.map(p=>p.x), ys=ns.map(p=>p.y);
  const w=Math.max(...xs)-Math.min(...xs)+200, h=Math.max(...ys)-Math.min(...ys)+200;
  const r=cv.getBoundingClientRect();
  cam.k=Math.min(r.width/w, r.height/h, 1.4);
  cam.x=-((Math.max(...xs)+Math.min(...xs))/2)*cam.k;
  cam.y=-((Math.max(...ys)+Math.min(...ys))/2)*cam.k;
}

/* ---- Interacción: coordenadas de pantalla -> mundo ---- */
function toWorld(ev){
  const r=cv.getBoundingClientRect();
  return {x:(ev.clientX-r.left-r.width/2-cam.x)/cam.k, y:(ev.clientY-r.top-r.height/2-cam.y)/cam.k};
}
function hit(ev){
  const w=toWorld(ev);
  let best=null,bd=1e9;
  allNodes().forEach(n=>{
    if(!visible(n)) return;
    const p=P[n.id]; if(!p) return;
    const d=Math.hypot(p.x-w.x,p.y-w.y);
    if(d<n.size+8 && d<bd){ bd=d; best=n; }
  });
  return best;
}
cv.addEventListener("pointermove",ev=>{
  if(dragging){
    cv._moved += Math.hypot(ev.clientX-last.x, ev.clientY-last.y);
    if(dragNode){ const w=toWorld(ev); P[dragNode].x=w.x; P[dragNode].y=w.y; alpha=Math.max(alpha,.5); }
    else { cam.x+=ev.clientX-last.x; cam.y+=ev.clientY-last.y; }
    last={x:ev.clientX,y:ev.clientY}; return;
  }
  const n=hit(ev); const id=n?n.id:null;
  if(id!==hover){ hover=id; cv.style.cursor=id?"pointer":"grab"; }
});
cv.addEventListener("pointerdown",ev=>{
  cv.setPointerCapture(ev.pointerId);
  const n=hit(ev); dragNode=n?n.id:null; dragging=true; last={x:ev.clientX,y:ev.clientY};
  cv.classList.add("drag"); cv._moved=0;
});
cv.addEventListener("pointerup",ev=>{
  // `_moved` se ACUMULA en pointermove: comparar con `last` aquí daría siempre
  // ~0 (last se actualiza en cada movimiento) y un arrastre se leería como clic.
  const wasNode=dragNode, moved=cv._moved;
  dragging=false; dragNode=null; cv.classList.remove("drag");
  const n=hit(ev);
  if(n && moved<6) openNode(n.id);
  else if(!n && moved<6 && !wasNode) closeCtx();
});
cv.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=ev.clientX-r.left-r.width/2, my=ev.clientY-r.top-r.height/2;
  const k2=Math.max(0.25,Math.min(3, cam.k*(ev.deltaY<0?1.12:0.89)));
  cam.x=mx-(mx-cam.x)*(k2/cam.k); cam.y=my-(my-cam.y)*(k2/cam.k); cam.k=k2;
},{passive:false});

/* ======================= COMPONENTE: ContextPanel ========================== */
function openNode(id){
  const n=nodeById(id); if(!n){ return; }
  if(S.surface!=="graph") go("graph");
  S.selected=id; think(700);
  const out=[], inn=[];
  allEdges().forEach(([a,b,v])=>{
    if(a===id){ const o=nodeById(b); if(o&&visible(o)) out.push([v,o]); }
    if(b===id){ const o=nodeById(a); if(o&&visible(o)) inn.push([v,o]); }
  });
  const insight = INSIGHTS[id] || genInsight(n,out,inn);
  const T=TYPES[n.type];
  $("#ctx").innerHTML=`
    <button class="iconbtn ctxclose" aria-label="Cerrar">✕</button>
    <span class="type"><i class="dot" style="background:${T.color}"></i>${T.label}</span>
    <h2>${esc(n.label)}</h2>
    <p class="lead" style="font-size:14.5px;margin:6px 0 4px">${esc(n.desc||"")}</p>
    ${typeof n.progress==="number"?`<div class="bar"><i style="width:${n.progress}%"></i></div>`:""}
    ${out.length?`<div class="k" style="margin-top:22px">Desde aquí</div>${out.map(([v,o])=>rel(v,o)).join("")}`:""}
    ${inn.length?`<div class="k" style="margin-top:22px">Hacia aquí</div>${inn.map(([v,o])=>rel(v,o,true)).join("")}`:""}
    <div class="insight" style="margin-top:22px"><div class="k">✦ Insight de IA</div><p>${insight}</p></div>
    <div class="chips">
      <button class="chip primary" data-a="block">Bloquear tiempo para esto</button>
      <button class="chip" data-a="ask">Preguntarle a la IA</button>
      <button class="chip" data-a="impact">Ver impacto</button>
    </div>`;
  $("#ctx").classList.add("open");
  $(".ctxclose").onclick=closeCtx;
  $$("#ctx .rel").forEach(r=>r.onclick=()=>openNode(r.dataset.id));
  $$("#ctx .chip").forEach(c=>c.onclick=()=>{
    const a=c.dataset.a;
    if(a==="block") blockSlot();
    else if(a==="ask"){ $("#cmd").value=`¿Qué debería hacer con ${n.label}?`; $("#cmd").focus(); }
    else aiSay(`<b>${esc(n.label)}</b> toca ${out.length+inn.length} nodos de tu vida: ${[...out,...inn].slice(0,4).map(([,o])=>esc(o.label)).join(", ")}. Si se cae, se mueven ${Math.max(1,Math.round((out.length+inn.length)/3))} objetivos.`);
  });
  speak(n.label+". "+insight.replace(/<[^>]+>/g,""));
}
function rel(v,o,inverse){
  return `<div class="rel" data-id="${o.id}"><span class="rv">${esc(v||"")}${inverse?" →":""}</span>
    <span class="rn"><i class="dot" style="background:${TYPES[o.type].color};display:inline-block;margin-right:7px"></i>${esc(o.label)}</span></div>`;
}
function genInsight(n,out,inn){
  const deg=out.length+inn.length;
  const goals=[...out,...inn].filter(([,o])=>o.type==="goal").length;
  if(goals>1) return `Este nodo empuja <b>${goals} objetivos</b> a la vez. Es de los pocos puntos de tu grafo con ese apalancamiento: moverlo mueve varias cosas.`;
  if(deg>=4)  return `Está conectado con <b>${deg} partes</b> de tu vida. Un nodo así no se cambia solo: cualquier decisión aquí se propaga.`;
  if(deg<=1)  return `Está casi aislado en tu grafo. O lo conectas con un objetivo, o compite por tu atención sin devolver nada.`;
  return `Conecta ${deg} nodos. Suficiente para importar, poco para ser un cuello de botella: buen candidato a delegar o automatizar.`;
}
function closeCtx(){ S.selected=null; $("#ctx").classList.remove("open"); }

/* Filtros por tipo — el único "control" del grafo, y se aprende mirándolo */
function renderFilters(){
  const bar=$("#gfilters"); bar.innerHTML="";
  Object.entries(TYPES).forEach(([k,v])=>{
    const c=el(`<button class="chip ${S.filters.has(k)?"":"on"}"><i class="dot" style="background:${v.color};display:inline-block;margin-right:7px"></i>${v.label}</button>`);
    c.onclick=()=>{ S.filters.has(k)?S.filters.delete(k):S.filters.add(k); renderFilters(); alpha=.7; };
    bar.appendChild(c);
  });
}

/* ==================== COMPONENTE: SmartCommandInput ========================
   El único input de toda la app. No es un buscador ni un chat: es la puerta
   por la que entra TODO (una tarea, una intención, una duda). La IA nunca
   guarda a ciegas — pregunta dónde va, porque conoce tu estructura.
   El "NLU" es rule-based y determinista a propósito: en un prototipo lo que
   se prueba es la CONVERSACIÓN, no el modelo.
   ============================================================================ */
const HINTS = [
  "Mañana tengo que preparar la presentación para dirección",
  "Quiero aprender inteligencia artificial",
  "¿Cómo voy hoy?",
  "Esta tarea va en el proyecto de inversiones",
  "Hoy no tengo energía"
];

function renderHints(){
  const h=$("#hints"); h.innerHTML="";
  HINTS.forEach(t=>{
    const c=el(`<button class="chip">${esc(t)}</button>`);
    c.onclick=()=>{ $("#cmd").value=t; submit(t); };
    h.appendChild(c);
  });
}

function push(cls,html){
  const c=$("#convo");
  const n=el(`<div class="msg ${cls}">${html}</div>`);
  c.appendChild(n); c.scrollTop=c.scrollHeight;
  while(c.children.length>8) c.removeChild(c.firstChild);
  return n;
}
/* La IA responde: piensa (orbe), escribe, y si hay opciones las ofrece. */
function aiSay(html, options){
  think(1100);
  const n=push("ai","");
  setTimeout(()=>{
    n.innerHTML=html;
    if(options&&options.length){
      const o=el(`<div class="opts"></div>`);
      options.forEach(([label,act,payload],i)=>{
        const c=el(`<button class="chip ${i===0?"primary":""}">${esc(label)}</button>`);
        c.onclick=()=>{ push("me",esc(label)); o.remove(); quickAction(act,label); if(payload) payload(); };
        o.appendChild(c);
      });
      n.appendChild(o);
    }
    $("#convo").scrollTop=1e6;
    speak(html.replace(/<[^>]+>/g," "));
  }, 560);
  return n;
}

/* Crea de verdad el nodo y la franja: el prototipo tiene que DEMOSTRAR que lo
   que dijiste aterrizó en la estructura, no solo contestarte bonito. */
function createTask(label, projectId, hour, verb){
  const id="t_"+Math.random().toString(36).slice(2,7);
  S.extraNodes.push({id, type:"task", label, size:11, desc:"Creada desde el command input.",
    links:[[projectId, id, verb||"contiene"]]});
  initGraph(); alpha=1;
  if(hour){
    S.extraSlots.push({h:hour, t:label, n:"Lo agendé yo a partir de lo que me dijiste."});
    renderDay();
  }
  toast(`«${label}» → ${nodeById(projectId).label}${hour?" · "+hour:""}`);
}
function createKnowledgePath(){
  const id="k_path";
  if(!nodeById(id)){
    S.extraNodes.push({id, type:"knowledge", label:"Ruta: Agentes de IA (8 semanas)", size:14,
      desc:"Ruta de aprendizaje creada desde el command input.",
      links:[["k_ai",id,"contiene"],[id,"p_ieos","alimenta"],[id,"g_digital","acerca"],[id,"i_build","refuerza"]]});
    initGraph(); alpha=1;
  }
  S.extraSlots.push({h:"07:30", t:"Ruta de aprendizaje · Agentes de IA", n:"Semana 1: patrones de orquestación. 30 min diarios."});
  renderDay(); go("graph"); openNode(id);
}

/* El parser. Cada rama existe porque responde a una forma real de hablar. */
function interpret(raw){
  const t=raw.toLowerCase();
  const tmr = /\bmañana\b/.test(t), today=/\bhoy\b/.test(t);
  const when = tmr?"mañana":today?"hoy":null;

  /* 1. Intención de aprender → el grafo contesta, no un buscador */
  if(/aprend|estudiar|quiero saber|dominar|curso/.test(t)){
    return aiSay(
      `Con base en tu Life Graph, esto no es un tema nuevo: ya está enganchado a cuatro cosas tuyas.<br><br>
       · <b>Intelligent Execution OS</b> — lo tiene como requisito<br>
       · <b>Crear productos digitales</b> — objetivo que depende de esto<br>
       · <b>Constructor de sistemas</b> — tu identidad más fuerte<br>
       · <b>NVDA</b> — tu tesis de inversión es la misma apuesta<br><br>
       Te propongo una ruta de <b>8 semanas, 30 min diarios</b>, anclada a tu lectura de las 07:30 (donde ya cumples 82%). Empieza por orquestación de agentes, que es tu cuello de botella.`,
      [["Créala y agéndala","apply",createKnowledgePath],["Enséñame la conexión","ctx-k"],["Solo guárdalo como interés","apply"]]);
  }

  /* 2. Presentación / dirección → desambiguación con estructura real */
  if(/present|dirección|direccion|junta|reunión|reunion|comité|comite/.test(t)){
    return aiSay(
      `Detecté una tarea${when?` para <b>${when}</b>`:""}. Por cómo hablas de «dirección», esto es <b>Ing. Ramírez</b> y cae en:<br><br>
       Proyecto: <b>Malpaso Modernization</b><br>
       Además toca tu objetivo <b>Convertirme en líder ejecutivo</b> — es tu única evidencia de liderazgo esta semana.<br><br>
       ¿Cómo lo guardo?`,
      [["Tarea dentro del proyecto","apply",()=>createTask("Preparar presentación para dirección","p_malpaso","06:30")],
       ["Evento en el calendario","apply",()=>createTask("Presentación a dirección","pe_dir","09:00","se presenta a")],
       ["Solo recordatorio","apply"]]);
  }

  /* 3. "esta tarea va en el proyecto X" → la IA pregunta DÓNDE exactamente */
  if(/\b(va|métel|metel|mete|incluye|agrégal|agregal|ponla|pon)\b.*(proyecto|lifeos|malpaso|inversion|inversión|portafolio)/.test(t)
     || /^(agrega|añade|apunta|nueva tarea|recuérdame|recuerdame)/.test(t)){
    const proj = /malpaso/.test(t) ? "p_malpaso"
               : /invers|portafolio|dinero/.test(t) ? "p_port"
               : /agente|ejecu|ieos/.test(t) ? "p_ieos" : "p_lifeos";
    const p=nodeById(proj);
    const label = raw.replace(/^(agrega|añade|apunta|recuérdame|recuerdame)\s*/i,"").replace(/\s+(al|en el|dentro del)\s+proyecto.*$/i,"").trim() || "Tarea nueva";
    return aiSay(
      `Va a <b>${esc(p.label)}</b>. Ese proyecto tiene tres frentes abiertos; ¿en cuál la cuelgo?`,
      [["En el frente activo","apply",()=>createTask(label.slice(0,48),proj, when?"06:30":null)],
       ["Crear frente nuevo","apply",()=>createTask(label.slice(0,48),proj)],
       ["Sin frente, al backlog","apply",()=>createTask(label.slice(0,48),proj)]]);
  }

  /* 4. Estado del día */
  if(/cómo voy|como voy|cómo vamos|como vamos|resumen|status|qué falta|que falta/.test(t)){
    const m=MOMENTS[S.m];
    const done=PRIORITIES.filter(p=>S.m>=p.doneAt).length;
    return aiSay(
      `Son las <b>${m.t}</b>. Llevas <b>${done} de 3</b> prioridades.<br><br>
       ${done<3?`Lo que sigue: <b>${esc(PRIORITIES.find(p=>S.m<p.doneAt).t)}</b>.`:"Cerraste las tres. Lo demás de hoy es opcional."}<br>
       ${S.extraSlots.length?"Tu hueco de las 16:15 ya está bloqueado.":"Aún tienes un hueco real a las 16:15 sin usar."}`,
      done<3?[["Bloquear tiempo ahora","block1615"],["Mover lo que falta a mañana","tomorrow"]]:[["Preparar mañana","confirm-tmr"]]);
  }

  /* 5. Energía baja → la IA reduce el día en vez de empujar */
  if(/no tengo energ|cansad|agotad|no puedo|mal día|mal dia/.test(t)){
    return quickAction("adapt");
  }

  /* 6. Dinero / mercados */
  if(/nvda|acciones|watchlist|mercado|bolsa|invers|bitcoin|btc/.test(t)){
    return quickAction("rebalance");
  }

  /* 7. Registro de hábito */
  if(/gym|entrené|entrene|medité|medite|leí|lei|corrí|corri/.test(t)){
    return aiSay(`Registrado. Con esto llevas <b>15 días</b> de racha y sumas evidencia a <b>cuerpo fuerte a los 40</b> (61% → 62%).`,
      [["Ver mi identidad","goto-graph"]]);
  }

  /* 8. Fallback: nunca "no entendí". Siempre devuelve contexto del grafo. */
  return aiSay(
    `Lo anoto${when?` para <b>${when}</b>`:""}. Por las palabras que usaste, se parece a algo de <b>${/malpaso|trabajo|equipo/.test(t)?"Malpaso Modernization":"LifeOS"}</b>.<br><br>¿Lo cuelgo ahí o prefieres decirme dónde va?`,
    [["Cuélgalo ahí","apply",()=>createTask(raw.slice(0,48), /malpaso|trabajo|equipo/.test(t)?"p_malpaso":"p_lifeos", when?"06:30":null)],
     ["Yo te digo dónde","apply",()=>{ go("graph"); toast("Elige el nodo donde va"); }],
     ["Déjalo suelto por ahora","apply"]]);
}

function submit(text){
  const v=(text!==undefined?text:$("#cmd").value).trim();
  if(!v) return;
  push("me",esc(v)); $("#cmd").value="";
  setTimeout(()=>interpret(v),120);
}
$("#cmdform").addEventListener("submit",e=>{ e.preventDefault(); submit(); });

/* Dictado — la misma puerta, con la voz. Si el navegador no lo soporta, el
   botón lo dice y no se rompe nada. */
$("#mic").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("Este navegador no soporta dictado; escríbelo"); return; }
  const r=new SR(); r.lang="es-MX"; r.interimResults=true;
  $("#mic").classList.add("on"); toast("Te escucho…");
  r.onresult=(e)=>{ $("#cmd").value=Array.from(e.results).map(x=>x[0].transcript).join(""); };
  r.onend=()=>{ $("#mic").classList.remove("on"); if($("#cmd").value.trim()) submit(); };
  r.onerror=()=>{ $("#mic").classList.remove("on"); toast("No pude escucharte"); };
  r.start();
};

/* ============================ 6. ARRANQUE ================================= */
$$(".switcher button").forEach(b=>b.onclick=()=>go(b.dataset.surface));
$("#scrub").addEventListener("input",e=>setMoment(+e.target.value));
$("#voice").onclick=()=>{
  S.voice=!S.voice; $("#voice").classList.toggle("on",S.voice);
  toast(S.voice?"Voz activada — la IA te habla":"Voz desactivada");
  if(S.voice) speak(MOMENTS[S.m].say.join(" "));
  else if("speechSynthesis" in window) speechSynthesis.cancel();
};
/* "Vivir el día": el prototipo se cuenta solo. Es la mejor demo de la idea. */
$("#play").onclick=()=>{
  S.playing=!S.playing; $("#play").classList.toggle("on",S.playing); $("#play").textContent=S.playing?"⏸":"▶";
  clearInterval($("#play")._i);
  if(S.playing){
    $("#play")._i=setInterval(()=>{
      if(S.m>=MOMENTS.length-1){ $("#play").click(); return; }
      setMoment(S.m+1);
    }, 7000);
    toast("Viviendo el día · un momento cada 7 s");
  }
};
document.addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement!==$("#cmd")){ e.preventDefault(); $("#cmd").focus(); }
  if(e.key==="Escape"){ closeCtx(); $("#cmd").blur(); }
  if(e.key==="ArrowRight" && e.altKey) setMoment(S.m+1);
  if(e.key==="ArrowLeft"  && e.altKey) setMoment(S.m-1);
});
window.addEventListener("resize",()=>{ resize(); });

resize(); initGraph(); renderFilters();
for(let i=0;i<220;i++) step();   // asentar el layout antes de encuadrar
fitGraph();
setMoment(0);
renderMemory();
renderHints();
setTimeout(()=>{ if(!$("#convo").children.length)
  aiSay("Estoy aquí. Puedes escribirme o dictarme cualquier cosa: una tarea suelta, una intención, o preguntarme cómo vas. Yo decido dónde va dentro de tu vida — y te pregunto si no lo tengo claro."); }, 2600);
</script>
